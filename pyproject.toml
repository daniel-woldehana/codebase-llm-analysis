[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codebase-llm-analyzer"
version = "1.1.0"
description = "Token-aware codebase analysis with deterministic Java parsing and LLM-enriched structured JSON output."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Daniel"}]
dependencies = [
  "langchain>=0.3.20,<2",
  "langchain-openai>=0.3.7,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "tiktoken>=0.9,<1",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
codebase-analyzer = "codebase_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
